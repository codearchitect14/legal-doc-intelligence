[project]
name = "legal-doc-intelligence-backend"
version = "0.1.0"
description = "Backend for the Legal Doc Intelligence platform"
authors = [
    { name = "codearchitect", email = "zainpashadev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.5",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<4.1",  # passlib 1.7's bcrypt version-detection breaks on bcrypt>=4.1
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
    "easyocr>=1.7",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "sentence-transformers>=3.0",
    "spacy>=3.8,<3.9",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's Depends()-as-default-argument is the framework's documented pattern, not a bug.
ignore = ["B008"]
