services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legal_doc_intelligence
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/legal_doc_intelligence
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Named volume for .venv so the container's Linux virtualenv never
      # overwrites the host's Windows/macOS .venv through the bind mount
      # above (they are binary-incompatible; sharing one broke local dev).
      - backend_venv:/app/.venv
      # sentence-transformers and EasyOCR download their model weights into
      # this cache on first use. Without a named volume here, every
      # container recreation re-downloads them from Hugging Face, adding
      # unnecessary startup latency and an avoidable external network
      # dependency on restart.
      - backend_model_cache:/root/.cache/huggingface
      - backend_model_cache_easyocr:/root/.EasyOCR
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  loki:
    image: grafana/loki:2.9.4
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.4
    restart: unless-stopped
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      # Remapped from Grafana's default 3000 - this machine already runs
      # another project's service on that port (see the standing port-
      # collision convention from Phase 0's db/redis remapping).
      - "3002:3000"
    environment:
      # Anonymous admin access is a local-dev convenience only - this stack
      # is not exposed beyond localhost. A real deployment must set real
      # Grafana credentials instead of relying on this.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  db_data:
  backend_venv:
  backend_model_cache:
  backend_model_cache_easyocr:
  loki_data:
  grafana_data:
